name: AgentFlow verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentflow_test
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: agentflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentflow_test -d agentflow_test"
          --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test API against PostgreSQL migrations and Redis
        working-directory: backend
        run: >-
          bash mvnw -B test
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/agentflow_test
          -Dspring.datasource.username=agentflow_test
          -Dspring.datasource.password=ci-only-disposable-password
          -Dspring.jpa.hibernate.ddl-auto=validate
          -Dspring.flyway.enabled=true
          -Drun.redis.integration=true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Engine tests
        working-directory: agent-engine
        run: |
          python -m pip install -r requirements.lock
          python -m pytest -q
      - name: Real isolated test execution and correction
        working-directory: agent-engine
        env:
          RUN_SANDBOX_INTEGRATION: 'true'
          SANDBOX_ENABLED: 'true'
        run: |
          docker pull python:3.14-slim
          python -m pytest -q tests/test_sandbox_integration.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Validate Compose configuration
        env:
          DATABASE_PASSWORD: ci-only-disposable-password
          JWT_SECRET: ci-only-jwt-secret-01234567890123456789
          ENGINE_SECRET: ci-only-engine-secret-01234567890123456789
          ENGINE_DATABASE_URL: postgresql+psycopg://agentflow_test:ci-only-disposable-password@postgres:5432/agentflow_test
        run: docker compose config --quiet
  images:
    runs-on: ubuntu-latest
    needs: platform
    steps:
      - uses: actions/checkout@v4
      - name: Build application images
        env:
          DATABASE_PASSWORD: ci-only-disposable-password
          JWT_SECRET: ci-only-jwt-secret-01234567890123456789
          ENGINE_SECRET: ci-only-engine-secret-01234567890123456789
          ENGINE_DATABASE_URL: postgresql+psycopg://agentflow:ci-only-disposable-password@postgres:5432/agentflow
        run: docker compose build
