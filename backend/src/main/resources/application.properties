spring.application.name=agentflow-api
spring.config.import=optional:file:./.env.local[.properties],optional:file:../.env.local[.properties]
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/agentflow}
spring.datasource.username=${DATABASE_USERNAME:agentflow}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s
spring.datasource.hikari.connection-timeout=5000
server.error.include-message=never
server.error.include-stacktrace=never
server.max-http-request-header-size=16KB
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
agentflow.jwt-secret=${JWT_SECRET}
agentflow.engine-url=${AGENT_ENGINE_URL:http://localhost:8000}
agentflow.engine-secret=${ENGINE_SECRET}
agentflow.workspace-root=${WORKSPACE_ROOT:./workspaces}
agentflow.cors-origin=${CORS_ORIGIN:http://localhost:5173}
agentflow.redis-enabled=${REDIS_ENABLED:true}
agentflow.bootstrap-email=${ADMIN_EMAIL:}
agentflow.bootstrap-password=${ADMIN_PASSWORD:}
